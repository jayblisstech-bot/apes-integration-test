name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  call-apes-v1:
    permissions:
      contents: read
      pull-requests: write
    uses: jayblisstech-bot/ai-production-engineering-standard/.github/workflows/ai-review.yml@9faec0392985fad49d64e7dac8921ab53086d7c2
    with:
      pipeline_ref: 9faec0392985fad49d64e7dac8921ab53086d7c2
      config_path: .apes.json
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS_JSON: ${{ secrets.GEMINI_API_KEYS_JSON }}
